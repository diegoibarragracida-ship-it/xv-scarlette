# Blueprint de Render (plan GRATUITO). Los datos y fotos se guardan en Supabase, no en Render.
services:
  - type: web
    name: xv-scarlette
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /panel
    envVars:
      - key: ADMIN_PASSWORD  # tu contraseña del panel
        sync: false
      - key: WALL_CODE       # parte secreta del link del muro, ej. scarlette-xv-2026
        sync: false
      - key: SUPABASE_URL    # https://xxxx.supabase.co
        sync: false
      - key: SUPABASE_KEY    # llave service_role (secreta)
        sync: false
