# Blueprint de Render: crea el servicio con su disco persistente.
services:
  - type: web
    name: xv-scarlette
    runtime: node
    plan: starter            # el disco persistente requiere un plan de pago
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /panel
    envVars:
      - key: ADMIN_PASSWORD  # tu contraseña del panel (Render te la pide al crear)
        sync: false
      - key: WALL_CODE       # parte secreta del link del muro, ej. scarlette-xv-2026
        sync: false
      - key: DATA_DIR
        value: /var/data
    disk:
      name: xv-datos
      mountPath: /var/data
      sizeGB: 5
